# To give a name to our Spring Boot application
spring.application.name=StudentPortal

#To run SpringBoot application on port number 9090
server.port=9090



#To specify the MySQL JDBC driver used by Spring Boot to connect to MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#To specify mysql database url that the application should connect to
spring.datasource.url=jdbc:mysql://localhost:3306/studentportal

#To specify the Mysql username to connect to the database
spring.datasource.username=root


#To specify th eMysql password used to connect to the database
spring.datasource.password=1030

#To automatically create or update database tables based on our Entity classes without deleting existing data.
spring.jpa.hibernate.ddl-auto=update

#To display the SQL queries executed by Hibernate in the Eclipse console.
spring.jpa.show-sql=true


